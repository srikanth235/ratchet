appId: dev.ratchet.desktop
productName: Ratchet
directories:
  output: release
files:
  - out/**
  - package.json
# better-sqlite3 is a native addon: it cannot be loaded from inside app.asar.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
# The ledger's drizzle migrations are read from disk at startup (see migrationsFolder() in src/main/index.ts).
extraResources:
  - from: ../core/src/ledger/migrations
    to: migrations
# The OpenTofu sandbox module: live mode runs `tofu` against Resources/infra/aws (Settings can point elsewhere).
# A pinned `tofu` binary placed in Resources/bin/ is picked up automatically (see defaultLivePaths).
  - from: ../../infra/aws
    to: infra/aws
    filter:
      - "**/*"
      - "!tests/**"
      - "!**/.terraform/**"
      - "!**/*.tfstate*"
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set; see docs/real-env/desktop.md.
  notarize: true
linux:
  target: [AppImage]
  category: Development
