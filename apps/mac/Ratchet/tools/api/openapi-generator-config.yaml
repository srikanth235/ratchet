# swift-openapi-generator configuration for Sources/RatchetAPI (see tools/generate-api.sh).
generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
# Only what the Mac app calls: the generated code stays reviewable, and the app does not compile routes it never uses
# (settings, secrets, reports, template proposals, ...). Add an operationId here to start using one.
filter:
  operations:
    - getStatus
    - getOverview
    - listOptimizations
    - getOptimization
    - listCandidates
    - getRatchetHistory
    - getWinningChange
    - createOptimization
    - startOptimization
    - stopOptimization
    - messageAgent
    - pauseAgent
    - resumeAgent
    - listTemplates
    - listRepos
    - inspectRepo
    - listConnectors
    - refreshConnectors
    - addGithubConnector
    - startGithubConnectorSignIn
    - cancelGithubConnectorSignIn
    - addAwsConnector
    - addAgentConnector
    - updateConnector
    - removeConnector
    - setDefaultConnector
    - testConnector
    - getConnectorSelection
    - saveConnectorSelection
    - createEnvironmentDraft
    - getEnvironmentDraft
    - reviseEnvironmentDraft
    - approveEnvironmentDraft
    - listEnvironments
    - endEnvironment
    - streamEvents
