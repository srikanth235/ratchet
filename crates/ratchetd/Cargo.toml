[package]
name = "ratchetd"
version = "0.0.0"
description = "Ratchet daemon: the HTTP + SSE API on a unix socket, its OpenAPI contract, and the simulation service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["server", "engine"]
# The daemon itself (axum, the service trait, the simulation). Without it the crate is only the API types, which is
# all a client such as the `ratchet` CLI needs.
server = [
    "dep:axum",
    "dep:ratchet-ledger",
    "dep:sqlx",
    "dep:clap",
    "dep:futures",
    "dep:tokio-stream",
    "dep:tracing-subscriber",
    "dep:utoipa-axum",
    "dep:anyhow",
    "dep:async-trait",
    "dep:libc",
    "dep:ratchet-github",
    "ratchet-connectors/store",
]

# `RealService`: the AppService of the real engine (`ratchet-engine`) and `ratchetd serve --mode real`.
engine = [
    "server",
    "dep:ratchet-engine",
    "dep:ratchet-agents",
]

[lib]
name = "ratchetd"

[[bin]]
name = "ratchetd"
path = "src/main.rs"
required-features = ["server", "engine"]

[dependencies]
ratchet-core = { path = "../ratchet-core", features = ["utoipa"] }
ratchet-connectors = { path = "../ratchet-connectors", default-features = false, features = ["utoipa"] }
ratchet-agents = { path = "../ratchet-agents", optional = true }
ratchet-engine = { path = "../ratchet-engine", optional = true }
ratchet-github = { path = "../ratchet-github", optional = true }
ratchet-ledger = { path = "../ratchet-ledger", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
utoipa = { version = "5", features = ["yaml"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }

anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4", optional = true, features = ["derive", "env"] }
futures = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
utoipa-axum = { version = "0.2", optional = true }

[dev-dependencies]
async-trait = "0.1"
ratchet-engine = { path = "../ratchet-engine", features = ["testing"] }
ratchet-sandbox = { path = "../ratchet-sandbox" }
ratchet-github = { path = "../ratchet-github" }
ratchet-agents = { path = "../ratchet-agents" }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
insta = { version = "1", features = ["json", "yaml"] }
serde_norway = "0.9"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
