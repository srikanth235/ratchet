[package]
name = "ratchet-github"
version = "0.0.0"
description = "GitHub for Ratchet: git hosts (local bare remote, GitHub), REST API, device-flow sign-in, result reports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# An in-process fake GitHub server (`testing::FakeGithubServer`) for tests of this and other crates.
testing = ["dep:axum"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
ratchet-core = { path = "../ratchet-core" }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt", "sync", "time", "io-util", "macros", "net", "fs"] }
percent-encoding = "2"
url = "2"
axum = { version = "0.8", optional = true }

[dev-dependencies]
# integration tests use the fake GitHub server and recording runner behind the `testing` feature
ratchet-github = { path = ".", features = ["testing"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
