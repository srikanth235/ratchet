[package]
name = "ratchet-sandbox"
version = "0.0.0"
description = "Ratchet cloud sandbox: AWS compute/artifacts/cost/images/reaper and the OpenTofu sandbox provider (port of packages/aws)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-costexplorer = "1.138.0"
aws-sdk-ec2 = "1.274.0"
aws-sdk-iam = "1.133.0"
aws-sdk-pricing = "1.123.0"
aws-sdk-s3 = "1.157.0"
aws-sdk-ssm = "1.133.0"
aws-sdk-sts = "1.124.0"
aws-smithy-types = "1.9.1"
base64 = "0.22.1"
futures = "0.3.31"
ratchet-core = { path = "../ratchet-core" }
ratchet-env = { path = "../ratchet-env" }
rand = "0.9.0"
regex = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
sha1 = "0.10.6"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.41"

[dev-dependencies]
aws-sdk-costexplorer = { version = "1.138.0", features = ["test-util"] }
aws-sdk-ec2 = { version = "1.274.0", features = ["test-util"] }
aws-sdk-iam = { version = "1.133.0", features = ["test-util"] }
aws-sdk-pricing = { version = "1.123.0", features = ["test-util"] }
aws-sdk-s3 = { version = "1.157.0", features = ["test-util"] }
aws-sdk-ssm = { version = "1.133.0", features = ["test-util"] }
aws-sdk-sts = { version = "1.124.0", features = ["test-util"] }
aws-smithy-mocks = "0.3.0"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.20.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
