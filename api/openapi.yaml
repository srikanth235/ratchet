      - githubFlow
      - encryptionAvailable
      - clientIdConfigured
      properties:
        clientIdConfigured:
          type: boolean
          description: True when a real OAuth client id is configured for "Sign in with GitHub".
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorVm'
        encryptionAvailable:
          type: boolean
          description: 'False when the keychain is unavailable: tokens and keys cannot be stored (the environment is still honoured).'
        githubFlow:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/GithubFlowVm'
