        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/pull-request:
    post:
      tags:
      - reports
      summary: Open the pull request with the squashed verified wins. 409 without a verified win.
      operationId: openPullRequest
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
