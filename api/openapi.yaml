      properties:
        agent:
          $ref: '#/components/schemas/AgentKind'
        label:
          type:
          - string
          - 'null'
        t:
          type: number
          format: double
          description: Minutes since start.
        value:
          type: number
          format: double
        verified:
          type: boolean
    RatchetSeries:
      type: object
      required:
      - metric
      - options
      - unit
      - direction
      - steps
      - points
      - tMax
      properties:
        baseline:
          type:
          - number
          - 'null'
          format: double
        direction:
          $ref: '#/components/schemas/Better'
        metric:
          type: string
          description: The metric this series plots (the objective unless another option was asked for).
        noiseFloor:
          type:
          - number
          - 'null'
          format: double
          description: Absolute noise floor of the baseline (metric units).
        options:
          type: array
          items:
            $ref: '#/components/schemas/MetricOption'
          description: Switch options (objective included); the screen shows a switch only when there are several.
        points:
          type: array
          items:
            $ref: '#/components/schemas/RatchetPoint'
          description: Every candidate that has a bench result.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepPoint'
          description: Staircase of the best value; the first step is the baseline at t=0.
        tMax:
          type: number
          format: double
        unit:
          type: string
    ReceiptRemoved:
      type: object
      description: What a sandbox teardown removed (counts; ids stay in the ledger).
      required:
      - instances
      - agentIdentities
      - secrets
      - resources
      properties:
        agentIdentities:
          type: integer
          format: int64
        instances:
          type: integer
          format: int64
        resources:
          type: array
          items:
            type: string
        secrets:
          type: integer
          format: int64
    ReceiptRun:
      type: object
      required:
      - optimizationId
      - status
      - spendUsd
      properties:
        optimizationId:
          type: string
        spendUsd:
          type: number
          format: double
        status:
          type: string
    ReceiptTrigger:
      type: string
      enum:
      - idle
      - manual
    RepoInspectVm:
      type: object
      description: What step 1 learned about the chosen repo (read from the default branch, never typed).
      required:
      - source
      - baseRef
      - errors
      - templates
      properties:
        baseRef:
          type: string
        config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConfigSummary'
            description: Parsed summary; `null` when there is no ratchet.yaml or it does not parse.
        configYaml:
          type:
          - string
          - 'null'
          description: The ratchet.yaml text, read-only; `null` when the repo has none.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ConfigError'
        problem:
          type:
          - string
          - 'null'
          description: Why the repo cannot be used here (a local folder with no GitHub remote, not a git repo, ...).
        repo:
          type:
          - string
          - 'null'
          description: '`owner/name` (also for a local folder, from its `origin`); `null` for a local folder with no GitHub remote.'
        source:
          $ref: '#/components/schemas/RepoSource'
        templates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateInfo'
          description: 'Offered when there is no ratchet.yaml: "Add via pull request".'
    RepoSource:
      oneOf:
      - type: object
        required:
        - repo
        - kind
        properties:
          kind:
            type: string
            enum:
            - github
          repo:
            type: string
      - type: object
        required:
        - path
        - kind
        properties:
          kind:
            type: string
            enum:
            - local
          path:
            type: string
      description: 'Where an optimization starts from: a GitHub repo of the signed-in account, or a local folder (this-machine runs).'
    RepoVm:
      type: object
      required:
      - fullName
      - defaultBranch
      - private
      properties:
        defaultBranch:
          type: string
        description:
          type:
          - string
          - 'null'
        fullName:
          type: string
          description: '`owner/name`'
        private:
          type: boolean
        pushedAt:
          type:
          - string
          - 'null'
    ReportVm:
      type: object
      description: The markdown report of an optimization (the app offers it in a save dialog, the CLI writes it to a file).
      required:
      - fileName
      - markdown
      properties:
        fileName:
          type: string
        markdown:
          type: string
    ReturnHero:
      type: object
      description: '"Return 84x: yearly value for every $1 spent, paid back in 4 days".'
      required:
      - note
      properties:
        note:
          type: string
        paybackDays:
          type:
          - number
          - 'null'
          format: double
        ratio:
          type:
          - number
          - 'null'
          format: double
          description: '`null` when nothing was spent.'
    ReviseEnvironmentDraftInput:
      type: object
      description: '`POST /v1/environment-drafts/{id}/revisions`: "Ask for a change", or "Use a smaller setup".'
      required:
      - request
      properties:
        request:
          type: string
          description: 'Plain words: "use RDS instead of a Postgres container".'
        scope:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EnvScope'
    SandboxChip:
      type: object
      description: The sandbox line at the bottom of the sidebar ("Sandbox on · acme-prod, $1.20 so far · off at 15:40").
      required:
      - on
      - spentUsd
      properties:
        name:
          type:
          - string
          - 'null'
        offAt:
          type:
          - integer
          - 'null'
          format: int64
        on:
          type: boolean
        spentUsd:
          type: number
          format: double
    SandboxPhase:
      type: string
      description: |-
        `creating` -> `ready` -> (`idle` while no run is active) -> `destroying` -> `destroyed`; `failed` when a step
        failed.
      enum:
      - creating
      - ready
      - idle
      - destroying
      - destroyed
      - failed
    SaveConnectorSelectionInput:
      type: object
      description: '`PUT /v1/connector-selections`: remember the choice for a repo.'
      required:
      - repo
      - selection
      properties:
        repo:
          type: string
        selection:
          $ref: '#/components/schemas/ConnectorSelectionInput'
    SecretName:
      type: string
      enum:
      - anthropicApiKey
      - openaiApiKey
      - githubToken
    SecretsPresent:
      type: object
      description: Which secrets are stored (never their values).
      required:
      - anthropicApiKey
      - openaiApiKey
      - githubToken
      properties:
        anthropicApiKey:
          type: boolean
        githubToken:
          type: boolean
        openaiApiKey:
          type: boolean
    SetAwsProfileInput:
      type: object
      required:
      - profile
      properties:
        profile:
          type: string
    SetSecretInput:
      type: object
      required:
      - value
      properties:
        value:
          type: string
    SettingsVm:
      type: object
      required:
      - awsProfile
      - awsRegion
      - secrets
      - advanced
      - encryptionAvailable
      - engine
      properties:
        advanced:
          $ref: '#/components/schemas/AdvancedSettingsVm'
        awsProfile:
          type: string
        awsRegion:
          type: string
        encryptionAvailable:
          type: boolean
          description: False when the OS keychain is unavailable, so secrets cannot be stored.
        engine:
          $ref: '#/components/schemas/EngineInfo'
        secrets:
          $ref: '#/components/schemas/SecretsPresent'
    SpanRow:
      type: object
      description: '"Where the time went": one evaluator-reported span, baseline vs best verified, in ms.'
      required:
      - name
      - baseline
      - best
      properties:
        baseline:
          type: number
          format: double
        best:
          type: number
          format: double
        name:
          type: string
    SpendByAgent:
      type: object
      required:
      - usd
      properties:
        agentId:
          type:
          - string
          - 'null'
        branch:
          type:
          - string
          - 'null'
        kind:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AgentKind'
        usd:
          type: number
          format: double
    SpendCategory:
      type: string
      description: Spend categories of the ledger. `tokens` are model API spend, which AWS does not bill.
      enum:
      - agent_runner
      - experiment
      - bench_runner
      - storage_egress
      - tokens
    SpendLine:
      type: object
      required:
      - id
      - label
      - usd
      properties:
        id:
          type: string
        label:
          type: string
        usd:
          type: number
          format: double
    SpendPoint:
      type: object
      required:
      - t
      - usd
      properties:
        t:
          type: number
          format: double
        usd:
          type: number
          format: double
    SpendVm:
      type: object
      required:
      - total
      - estimated
      - actual
      - budgetUsd
      - byCategory
      - byAgent
      - series
      properties:
        actual:
          type: number
          format: double
        budgetUsd:
          type: number
          format: double
        byAgent:
          type: array
          items:
            $ref: '#/components/schemas/SpendByAgent'
        byCategory:
          type: array
          items:
            $ref: '#/components/schemas/SpendLine'
        estimated:
          type: number
          format: double
        series:
          type: array
          items:
            $ref: '#/components/schemas/SpendPoint'
          description: Cumulative spend over minutes since start.
        total:
          type: number
          format: double
    SpentHero:
      type: object
      description: '"Spent $184 of $500 across AWS and agent keys".'
      required:
      - usd
      - note
      properties:
        capUsd:
          type:
          - number
          - 'null'
          format: double
          description: The total monthly caps of the connected AWS accounts and keys, when any is set.
        fractionOfCap:
          type:
          - number
          - 'null'
          format: double
          description: 0..=1, for the thin bar; `null` without a cap.
        note:
          type: string
          description: '"across AWS and agent keys"'
        usd:
          type: number
          format: double
    StageId:
      type: string
      enum:
      - checkout
      - guardrails
      - bench
      - confirm
      - verdict
    StageState:
      type: string
      enum:
      - done
      - active
      - idle
      - failed
    Staircase:
      type: object
      required:
      - from
      - to
      - points
      properties:
        from:
          type: integer
          format: int64
        points:
          type: array
          items:
            $ref: '#/components/schemas/StaircasePoint'
        to:
          type: integer
          format: int64
    StaircasePoint:
      type: object
      description: One verified win on the staircase. `usdPerYear` is cumulative after this win.
      required:
      - at
      - usdPerYear
      - optimizationId
      - optimizationName
      properties:
        at:
          type: integer
          format: int64
        optimizationId:
          type: string
        optimizationName:
          type: string
        usdPerYear:
          type: number
          format: double
    StepPoint:
      type: object
      required:
      - t
      - value
      properties:
        t:
          type: number
          format: double
        value:
          type: number
          format: double
    StopOptimizationInput:
      type: object
      properties:
        reason:
          type:
          - string
          - 'null'
    TeardownReceiptVm:
      type: object
      description: The receipt of the sandbox teardown that covered a run (core `SandboxTeardownReceipt`, trimmed for the UI).
      required:
      - sandboxId
      - region
      - trigger
      - destroyedAt
      - spendUsd
      - spendByCategory
      - runs
      - removed
      - nothingRunning
      - orphans
      - errors
      - summary
      properties:
        destroyedAt:
          type: integer
          format: int64
        errors:
          type: array
          items:
            type: string
        nothingRunning:
          type: boolean
          description: 'Verified after the destroy: nothing tagged is left, so nothing is billing.'
        orphans:
          type: array
          items:
            type: string
        region:
          type: string
        removed:
          $ref: '#/components/schemas/ReceiptRemoved'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptRun'
        sandboxId:
          type: string
        spendByCategory:
          type: array
          items:
            $ref: '#/components/schemas/LabeledUsd'
        spendUsd:
          type: number
          format: double
        summary:
          type: string
        trigger:
          $ref: '#/components/schemas/ReceiptTrigger'
    TemplateCategory:
      type: string
      description: Gallery grouping of templates (formerly "domain packs").
      enum:
      - perf
      - forecasting
      - llm
    TemplateInfo:
      type: object
      description: 'Public, UI-friendly description of one template. Stable shape: the app''s gallery renders it.'
      required:
      - id
      - kind
      - category
      - title
      - description
      - measures
      - machine
      - evaluatorKind
      - objective
      - defaultValueUsd
      - files
      properties:
        category:
          $ref: '#/components/schemas/TemplateCategory'
        defaultValueUsd:
          type: number
          format: double
          description: Placeholder USD per unit of improvement per year, written to the generated config (replace it).
        description:
          type: string
          description: 'One sentence: what improving this means.'
        evaluatorKind:
          $ref: '#/components/schemas/EvaluatorKind'
        example:
          type:
          - string
          - 'null'
          description: 'Demos only: the example project, relative to the repository root (e.g. `examples/demo-search`).'
        files:
          type: array
          items:
            type: string
          description: Repo paths the template adds (empty for demos).
        holdout:
          type:
          - string
          - 'null'
          description: The hidden workload that re-checks every win, or `None` when the template has none.
        id:
          type: string
          description: Id used by `evaluator.template`, `ratchet init --template` and `build_template_proposal`.
        kind:
          $ref: '#/components/schemas/TemplateKind'
        machine:
          type: string
          description: Default bench machine (instance type).
        measures:
          type: string
          description: What the evaluator reports, in plain words (e.g. "k6 p50/p95/p99, error rate").
        objective:
          $ref: '#/components/schemas/TemplateObjective'
        title:
          type: string
    TemplateKind:
      type: string
      description: Whether a template is a real, runnable evaluator or a "Try a demo" entry.
      enum:
      - template
      - demo
    TemplateObjective:
      type: object
      description: The default objective of a template.
      required:
      - metric
      - direction
      - unit
      properties:
        direction:
          $ref: '#/components/schemas/Direction'
        metric:
          type: string
          description: Key the evaluator prints, as a dotted path.
        unit:
          type: string
    TestConnectionInput:
      type: object
      required:
      - target
      properties:
        target:
          $ref: '#/components/schemas/ConnectionTarget'
    TimeWindow:
      type: object
      required:
      - startMs
      - endMs
      properties:
        endMs:
          type: integer
          format: int64
        startMs:
          type: integer
          format: int64
    Tone:
      type: string
      enum:
      - good
      - bad
      - neutral
    UiStatus:
      type: string
      description: 'The optimization status as the screens show it: the ledger status, or `pr-open` once a pull request exists.'
      enum:
      - draft
      - baselining
      - running
      - stopping
      - completed
      - stopped
      - failed
      - pr-open
    UpdateConnectorInput:
      type: object
      description: '`PATCH /v1/connectors/{id}`: rename, change the cap, make default.'
      properties:
        apiKey:
          type:
          - string
          - 'null'
          description: Replace the stored API key.
        capUsdPerMonth:
          type:
          - number
          - 'null'
          format: double
        isDefault:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
        region:
          type:
          - string
          - 'null'
    ValidateConfigInput:
      type: object
      required:
      - yaml
      properties:
        yaml:
          type: string
          description: The ratchet.yaml text.
    ValidateConfigResult:
      type: object
      description: 'Result of validating `ratchet.yaml` text: a summary when it is valid, the problems when it is not.'
      required:
      - ok
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ConfigError'
        ok:
          type: boolean
        summary:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConfigSummary'
    ValueBasis:
      type: string
      description: '`estimated` until the value has been measured in production.'
      enum:
      - estimated
      - measured
    ValueHero:
      type: object
      description: '"Value locked in $15.4k / yr from 9 verified wins (estimated)".'
      required:
      - usdPerYear
      - wins
      - basis
      - note
      properties:
        basis:
          $ref: '#/components/schemas/ValueBasis'
        note:
          type: string
        usdPerYear:
          type: number
          format: double
        wins:
          type: integer
          format: int64
    ValuePeriod:
      type: string
      description: The period a value-model amount is quoted for.
      enum:
      - month
      - year
    ValueSummary:
      type: object
      required:
      - usdPerUnit
      - period
      - basis
      properties:
        basis:
          $ref: '#/components/schemas/ValueBasis'
        period:
          $ref: '#/components/schemas/ValuePeriod'
        unit:
          type:
          - string
          - 'null'
        usdPerUnit:
          type: number
          format: double
    ValueVm:
      type: object
      description: '`objective.value` applied to baseline -> best (core `estimate_value` / `return_on_spend`).'
      required:
      - usdPerUnit
      - period
      - basis
      - usdPerYear
      properties:
        basis:
          $ref: '#/components/schemas/ValueBasis'
        period:
          $ref: '#/components/schemas/ValuePeriod'
        returnOnSpend:
          type:
          - number
          - 'null'
          format: double
          description: Yearly value per dollar spent; `null` when nothing was spent.
        unit:
          type:
          - string
          - 'null'
        usdPerUnit:
          type: number
          format: double
        usdPerYear:
          type: number
          format: double
    WinningChangeVm:
      type: object
      description: 'The squashed result: best verified commit vs the base ref, as the pull request will show it.'
      required:
      - commits
      - baseRef
      - files
      - additions
      - deletions
      properties:
        additions:
          type: integer
          format: int64
          minimum: 0
        baseRef:
          type: string
        commits:
          type: integer
          format: int64
          description: Verified commits (ratchet moves) the PR squashes.
        deletions:
          type: integer
          format: int64
          minimum: 0
        excerpt:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DiffExcerpt'
            description: First hunk of the most-changed file.
        files:
          type: array
          items:
            $ref: '#/components/schemas/DiffFileVm'
        sha:
          type:
          - string
          - 'null'
          description: Short sha of the best verified commit; `null` before the first win.
        unavailable:
          type:
          - string
          - 'null'
          description: Why there is no diff (no wins yet, the engine has no git access, git failed); `null` when `files` is real.
  responses:
    BadRequest:
      description: The request is malformed or a field is invalid (see `fields`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Failure:
      description: Any other failure; `code` says which.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: status
  description: The daemon itself.
- name: events
  description: The live event stream (server-sent events).
- name: optimizations
  description: Optimizations, their candidates, ratchet history and spend.
- name: agents
  description: 'Agents: log, pause, resume, messages.'
- name: reports
  description: Reports and pull requests.
- name: config
  description: ratchet.yaml validation and preflight.
- name: settings
  description: Settings, secrets, connection tests.
- name: github
  description: GitHub sign-in, repos, inspecting a repo.
- name: aws
  description: AWS profiles.
- name: harnesses
  description: Detected agent CLIs.
- name: templates
  description: Evaluator templates (Benchmarks).
- name: environments
  description: 'Sandboxes: what is running, end now, receipts.'
- name: overview (provisional)
  description: 'PROVISIONAL. Overview: spent, value locked in, return, needs you.'
- name: connectors (provisional)
  description: PROVISIONAL. Saved GitHub / AWS / agent connectors and per-repo selection.
- name: environment drafts (provisional)
  description: 'PROVISIONAL. Dynamic environment drafts: draft, revise, approve.'
