          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReconcileReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/start:
    post:
      tags:
      - optimizations
      summary: Start the baseline and the agents. Idempotent while running; refused (409) once the optimization ended.
      operationId: startOptimization
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Started
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already ended or not ready
