      - unit
      properties:
        basis:
          $ref: '#/components/schemas/ValueBasis'
        period:
          $ref: '#/components/schemas/ValuePeriod'
        unit:
          type:
          - string
          - 'null'
        usdPerUnit:
          type: number
          format: double
    ValueVm:
      type: object
      description: '`objective.value` applied to baseline -> best (core `estimate_value` / `return_on_spend`).'
      required:
      - usdPerUnit
      - unit
      - period
      - basis
      - usdPerYear
      - returnOnSpend
      properties:
        basis:
          $ref: '#/components/schemas/ValueBasis'
        period:
          $ref: '#/components/schemas/ValuePeriod'
        returnOnSpend:
          type:
          - number
          - 'null'
          format: double
          description: Yearly value per dollar spent; `null` when nothing was spent.
        unit:
          type:
          - string
          - 'null'
        usdPerUnit:
          type: number
          format: double
        usdPerYear:
          type: number
          format: double
    WinningChangeVm:
      type: object
      description: 'The squashed result: best verified commit vs the base ref, as the pull request will show it.'
      required:
      - commits
      - sha
      - baseRef
      - files
      - additions
      - deletions
      - excerpt
      - unavailable
      properties:
        additions:
          type: integer
          format: int64
          minimum: 0
        baseRef:
          type: string
        commits:
          type: integer
          format: int64
          description: Verified commits (ratchet moves) the PR squashes.
        deletions:
          type: integer
          format: int64
          minimum: 0
        excerpt:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DiffExcerpt'
            description: First hunk of the most-changed file.
        files:
          type: array
          items:
            $ref: '#/components/schemas/DiffFileVm'
        sha:
          type:
          - string
          - 'null'
          description: Short sha of the best verified commit; `null` before the first win.
        unavailable:
          type:
          - string
          - 'null'
          description: Why there is no diff (no wins yet, the engine has no git access, git failed); `null` when `files` is real.
  responses:
    BadRequest:
      description: The request is malformed or a field is invalid (see `fields`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Failure:
      description: Any other failure; `code` says which.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or wrong bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
