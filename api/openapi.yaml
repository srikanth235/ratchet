          type: boolean
    CostReconcileReport:
      type: object
      required:
      - optimizationId
      - at
      - status
      - window
      - lines
      - writtenUsd
      properties:
        at:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CostReconcileLine'
        optimizationId:
          $ref: '#/components/schemas/OptimizationId'
        reason:
          type:
          - string
          - 'null'
