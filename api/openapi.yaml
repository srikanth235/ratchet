                $ref: '#/components/schemas/Calibration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/candidates:
    get:
      tags:
      - optimizations
