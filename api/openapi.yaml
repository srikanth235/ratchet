openapi: 3.1.0
info:
  title: ratchetd
  description: 'The Ratchet daemon API: REST resources over HTTP on a local unix socket, plus one server-sent-event stream. Every route needs `Authorization: Bearer <token>` (the per-boot token the daemon writes next to its socket). Timestamps are epoch milliseconds, money is USD. Routes tagged `(provisional)` mirror features that are still being built and may change.'
  version: v1
servers:
- url: http://localhost
  description: The daemon, over its unix socket (`ratchetd.sock`).
paths:
  /v1/activity:
    get:
      tags:
      - optimizations
      summary: The merged, newest-first feed of verdicts and verified wins.
      operationId: listActivity
      parameters:
      - name: optimizationId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 1..=200, default 20.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/events:
    get:
      tags:
      - agents
      summary: 'An agent''s log. Without `cursor`: the newest events (oldest first). With it: only events newer than the cursor.'
      operationId: listAgentEvents
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: 'Return only events newer than this id. Without it: the newest `limit` events.'
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 1..=1000, default 200.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEventsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/messages:
    post:
      tags:
      - agents
      summary: Send the agent a note; it reads it at the start of its next turn.
      operationId: messageAgent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageAgentInput'
        required: true
      responses:
        '204':
          description: Delivered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/pause:
    post:
      tags:
      - agents
      summary: Pause the agent after its current step.
      operationId: pauseAgent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Paused
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/resume:
    post:
      tags:
      - agents
      summary: Resume a paused agent.
      operationId: resumeAgent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Resumed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/aws/profiles:
    get:
      tags:
      - aws
      summary: The AWS profiles found on this Mac (names only).
      operationId: listAwsProfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsProfilesVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/config/validations:
    post:
      tags:
      - config
      summary: 'Parse ratchet.yaml text (read-only; the repo owns the file). Always 200: problems are in the result.'
      operationId: validateConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateConfigInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connection-tests:
    post:
      tags:
      - settings
      summary: A read-only probe of AWS (STS), GitHub or a model API. Secrets are read inside the daemon.
      operationId: testConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResultVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connector-selections:
    get:
      tags:
      - connectors (provisional)
      summary: The remembered connector choice for a repo, or the defaults.
      operationId: getConnectorSelection
      parameters:
      - name: repo
        in: query
        description: '`owner/name`'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorSelectionVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
    put:
      tags:
      - connectors (provisional)
      summary: Remember the connector choice for a repo ("Remembered for this repo").
      operationId: saveConnectorSelection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveConnectorSelectionInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorSelectionVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors:
    get:
      tags:
      - connectors (provisional)
      summary: 'Every saved connector: GitHub accounts, AWS accounts, agents.'
      operationId: listConnectors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectorVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
    post:
      tags:
      - connectors (provisional)
      summary: Add a connector. Secrets in the body go to the keychain and are never returned.
      operationId: createConnector
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectorInput'
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/{id}:
    get:
      tags:
      - connectors (provisional)
      summary: One connector.
      operationId: getConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
    delete:
      tags:
      - connectors (provisional)
      summary: Remove a connector and forget its secret. Optimizations already running keep what they have.
      operationId: deleteConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
    patch:
      tags:
      - connectors (provisional)
      summary: Rename, change the cap or region, replace the key, make default.
      operationId: updateConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectorInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/{id}/test:
    post:
      tags:
      - connectors (provisional)
      summary: '"Test" / "Sign in": probe the account and refresh its status.'
      operationId: testConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorTestVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts:
    post:
      tags:
      - environment drafts (provisional)
      summary: Ask an agent to draft the environment this goal needs (scope none, single or full, resources, checks, cost).
      operationId: createEnvironmentDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentDraftInput'
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}:
    get:
      tags:
      - environment drafts (provisional)
      summary: One environment draft.
      operationId: getEnvironmentDraft
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/approval:
    post:
      tags:
      - environment drafts (provisional)
      summary: 'Approve and lock the environment: agents change code only, never the environment. 409 unless every check passed.'
      operationId: approveEnvironmentDraft
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/files:
    get:
      tags:
      - environment drafts (provisional)
      summary: '"View files": the files the draft adds, with their content.'
      operationId: listEnvironmentDraftFiles
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvFilesVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/pull-request:
    post:
      tags:
      - environment drafts (provisional)
      summary: '"Open as PR": add the environment files to the repo through a pull request.'
      operationId: openEnvironmentDraftPullRequest
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/revisions:
    post:
      tags:
      - environment drafts (provisional)
      summary: '"Ask for a change" or "Use a smaller setup": the agent revises the draft. 409 once approved.'
      operationId: reviseEnvironmentDraft
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseEnvironmentDraftInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environments:
    get:
      tags:
      - environments
      summary: 'What is running and what it costs: the automatic environments and the last teardown receipt.'
      operationId: listEnvironments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environments/{sandboxId}/end:
    post:
      tags:
      - environments
      summary: '"End sandbox now": tear the environment down without waiting for the idle window. 409 while a run is active.'
      operationId: endEnvironment
      parameters:
      - name: sandboxId
        in: path
        description: Sandbox id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A run is still active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/Failure'
  /v1/events:
    get:
      tags:
      - events
      summary: The live event stream (server-sent events).
      description: |-
        Each message has `event:` = the `type` of the payload, `id:` = a sequence number and `data:` = the JSON of an
        `ApiEvent`. Reconnect with `Last-Event-ID` to receive what was missed; when the daemon cannot replay it (it
        restarted, or the gap is older than its window) the stream starts with a `resync` event and the client refetches
        its snapshots. The first message is always `hello` (it has no `id`). A comment line keeps the connection alive.
      operationId: streamEvents
      parameters:
      - name: Last-Event-ID
        in: header
        description: Id of the last event the client saw.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      responses:
        '200':
          description: A stream of server-sent events; each `data:` is an ApiEvent.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ApiEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/repos:
    get:
      tags:
      - github
      summary: The signed-in account's repos, optionally filtered by a substring of `owner/name`. 409 when not signed in.
      operationId: listRepos
      parameters:
      - name: query
        in: query
        description: Substring of `owner/name`.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepoVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/session:
    delete:
      tags:
      - github
      summary: Sign out of GitHub and forget the token.
      operationId: signOutOfGithub
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubStatusVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/sign-in:
    post:
      tags:
      - github
      summary: 'Start "Sign in with GitHub" (device flow): returns the code to show; the daemon polls and stores the token.'
      operationId: startGithubSignIn
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubStatusVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/status:
    get:
      tags:
      - github
      summary: The GitHub row of Settings.
      operationId: getGithubStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubStatusVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/harnesses:
    get:
      tags:
      - harnesses
      summary: 'The detected agent CLIs (Claude Code, Codex): installed, version, signed in.'
      operationId: listHarnesses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HarnessVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/harnesses/detections:
    post:
      tags:
      - harnesses
      summary: '"Re-detect": probe the machine again.'
      operationId: detectHarnesses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HarnessVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations:
    get:
      tags:
      - optimizations
      summary: 'Everything the Optimizations screen shows: KPI cards, the featured run''s chart, the table, the activity feed.'
      operationId: listOptimizations
      parameters:
      - name: range
        in: query
        description: KPI window; default `30d`.
        required: false
        schema:
          $ref: '#/components/schemas/KpiRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationsSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
    post:
      tags:
      - optimizations
      summary: Create an optimization (a draft; `start` runs it). With `demo` it runs in simulation with no setup.
      operationId: createOptimization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptimizationInput'
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOptimization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}:
    get:
      tags:
      - optimizations
      summary: One optimization with its agents, bench pipeline, baseline vs best, receipt and calibration.
      operationId: getOptimization
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/calibration:
    get:
      tags:
      - optimizations
      summary: The auto-calibrated statistics (repeats, the gain a win must beat). 404 until the baseline has run.
      operationId: getCalibration
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calibration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/candidates:
    get:
      tags:
      - optimizations
      summary: Every candidate commit with its verdict and bench results.
      operationId: listCandidates
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/protected-paths:
    get:
      tags:
      - optimizations
      summary: 'Every protected path with why: the automatic set plus the user''s list.'
      operationId: getProtectedPaths
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveProtected'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/pull-request:
    post:
      tags:
      - reports
      summary: Open the pull request with the squashed verified wins. 409 without a verified win.
      operationId: openPullRequest
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No verified win yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/ratchet:
    get:
      tags:
      - optimizations
      summary: 'The ratchet chart: baseline step, one step per verified win, a point per candidate.'
      operationId: getRatchetHistory
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      - name: metric
        in: query
        description: One of the series' `options` keys; default the objective.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatchetSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/receipt:
    get:
      tags:
      - environments
      summary: The receipt of the sandbox teardown that covered this run. 404 while the environment is still alive.
      operationId: getReceipt
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeardownReceiptVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/report:
    get:
      tags:
      - reports
      summary: The markdown report of the optimization.
      operationId: getReport
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/spend:
    get:
      tags:
      - optimizations
      summary: Spend by category and by agent, estimated vs reconciled, and the cumulative series.
      operationId: getSpend
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/spend/reconciliations:
    post:
      tags:
      - optimizations
      summary: Compare the ledger's estimates with billing and record correction rows. Idempotent; `pending` while billing lags.
      operationId: reconcileSpend
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReconcileReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/start:
    post:
      tags:
      - optimizations
      summary: Start the baseline and the agents. Idempotent while running; refused (409) once the optimization ended.
      operationId: startOptimization
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Started
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already ended or not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/stop:
    post:
      tags:
      - optimizations
      summary: 'The kill switch: stop the agents and end the run.'
      operationId: stopOptimization
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      requestBody:
        description: Optional; an empty body is fine.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopOptimizationInput'
        required: true
      responses:
        '204':
          description: Stopped
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/winning-change:
    get:
      tags:
      - optimizations
      summary: 'The squashed result: best verified commit vs the base ref, as the pull request will show it.'
      operationId: getWinningChange
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WinningChangeVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/overview:
    get:
      tags:
      - overview (provisional)
      summary: 'Overview: spent, value locked in, return, the value staircase, what needs you, the table. PROVISIONAL.'
      operationId: getOverview
      parameters:
      - name: range
        in: query
        description: Window of the hero numbers and the staircase; default `90d`.
        required: false
        schema:
          $ref: '#/components/schemas/OverviewRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/preflight:
    post:
      tags:
      - config
      summary: '"What''s missing" for a run: the short list on the New optimization page.'
      operationId: runPreflight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflightInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreflightItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/repos/inspections:
    post:
      tags:
      - github
      summary: |-
        What step 1 of New optimization learns about a repo (a GitHub repo or a local folder): its ratchet.yaml, a
        summary, or the templates to add one.
      operationId: inspectRepo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRepoInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoInspectVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings:
    get:
      tags:
      - settings
      summary: 'The Settings screen: AWS profile and region, which secrets are stored, the advanced overrides, the engine.'
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings/advanced:
    put:
      tags:
      - settings
      summary: |-
        Region and the development overrides (AMI ids, OpenTofu paths). Validated as a whole; nothing is saved if any
        field is invalid (400 with a `fields` entry per problem).
      operationId: saveAdvancedSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveSettingsInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings/aws-profile:
    put:
      tags:
      - settings
      summary: Choose the AWS profile Ratchet uses (an empty name clears it).
      operationId: setAwsProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAwsProfileInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings/secrets/{name}:
    put:
      tags:
      - settings
      summary: Store a secret in the keychain. The value is checked for format before anything is stored and never returned.
      operationId: setSecret
      parameters:
      - name: name
        in: path
        description: anthropicApiKey, openaiApiKey or githubToken
        required: true
        schema:
          $ref: '#/components/schemas/SecretName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSecretInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
    delete:
      tags:
      - settings
      summary: Remove a stored secret.
      operationId: clearSecret
      parameters:
      - name: name
        in: path
        description: anthropicApiKey, openaiApiKey or githubToken
        required: true
        schema:
          $ref: '#/components/schemas/SecretName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/status:
    get:
      tags:
      - status
      summary: 'Who is answering: version, engine, uptime, where the socket and the ledger are.'
      operationId: getStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/template-proposals:
    post:
      tags:
      - templates
      summary: '"Use template" / "Add via pull request": commit the template''s files on a branch of the repo and open the PR.'
      operationId: proposeTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeTemplateInput'
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposeTemplateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/templates:
    get:
      tags:
      - templates
      summary: 'The evaluator template gallery (Benchmarks): runnable templates, then the "Try a demo" entries.'
      operationId: listTemplates
      parameters:
      - name: kind
        in: query
        description: '`template` (runnable evaluators) or `demo` ("Try a demo"); default both.'
        required: false
        schema:
          $ref: '#/components/schemas/TemplateKind'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/templates/{id}:
    get:
      tags:
      - templates
      summary: One template by id (a legacy `--pack` name is accepted).
      operationId: getTemplate
      parameters:
      - name: id
        in: path
        description: Template id, e.g. http-latency
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
components:
  schemas:
    ActivityTone:
      type: string
      enum:
      - brass
      - mint
      - rose
      - neutral
    ActivityVm:
      type: object
      required:
      - id
      - optimizationId
      - text
      - at
      - atMs
      - tone
      properties:
        agent:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AgentKind'
        at:
          type: string
          description: Relative time ("12m ago").
        atMs:
          type: integer
          format: int64
        id:
          type: string
        optimizationId:
          type: string
        text:
          type: string
        tone:
          $ref: '#/components/schemas/ActivityTone'
    AdvancedDefaults:
      type: object
      description: What empty `tofuBinary` / `moduleDir` resolve to.
      required:
      - tofuBinary
      - moduleDir
      properties:
        moduleDir:
          type: string
        tofuBinary:
          type: string
    AdvancedSettingsVm:
      type: object
      description: The "Advanced (development)" disclosure of Settings.
      required:
      - values
      - defaults
      properties:
        defaults:
          $ref: '#/components/schemas/AdvancedDefaults'
        values:
          $ref: '#/components/schemas/LiveSettings'
    AgentConnectorInfo:
      type: object
      required:
      - agent
      - credential
      - runsIn
      properties:
        agent:
          $ref: '#/components/schemas/AgentKind'
        credential:
          $ref: '#/components/schemas/AgentCredential'
        keyHint:
          type:
          - string
          - 'null'
          description: Last characters of an API key (`····4f2a`).
        runsIn:
          type: array
          items:
            $ref: '#/components/schemas/AgentsWhere'
          description: 'Where this connector can run agents: a login runs on this Mac, a key also in the cloud.'
        version:
          type:
          - string
          - 'null'
          description: CLI version for a login connector.
    AgentCredential:
      type: string
      enum:
      - login
      - api-key
    AgentEventVm:
      type: object
      required:
      - id
      - at
      - type
      - text
      properties:
        at:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        text:
          type: string
        type:
          type: string
    AgentEventsPage:
      type: object
      required:
      - events
      - cursor
      properties:
        cursor:
          type: integer
          format: int64
          description: Pass back as `cursor` to get only newer events.
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEventVm'
    AgentKind:
      type: string
      description: Which agent CLI (or the mock) an agent runs.
      enum:
      - claude-code
      - codex
      - mock
    AgentRecentEval:
      type: object
      required:
      - value
      - verdict
      - label
      properties:
        label:
          type: string
        value:
          type: number
          format: double
        verdict:
          $ref: '#/components/schemas/CandidateVerdict'
    AgentSelection:
      type: object
      description: 'One agent choice on the New optimization step: a connector and where it runs.'
      required:
      - connectorId
      - runsIn
      properties:
        connectorId:
          type: string
        runsIn:
          $ref: '#/components/schemas/AgentsWhere'
    AgentStats:
      type: object
      required:
      - candidates
      - verified
      - rejected
      - blocked
      - spendUsd
      properties:
        blocked:
          type: integer
          format: int64
        candidates:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
        spendUsd:
          type: number
          format: double
        verified:
          type: integer
          format: int64
    AgentStatus:
      type: string
      description: Agent lifecycle state.
      enum:
      - pending
      - launching
      - running
      - paused
      - stopped
      - done
      - failed
    AgentVm:
      type: object
      required:
      - id
      - kind
      - branch
      - status
      - recent
      - stats
      - lastEventId
      properties:
        branch:
          type: string
        hypothesis:
          type:
          - string
          - 'null'
          description: Latest agent message, used as the "current hypothesis".
        id:
          type: string
        kind:
          $ref: '#/components/schemas/AgentKind'
        lastEventId:
          type: integer
          format: int64
          description: Pass to `GET /v1/agents/{id}/events?cursor=` to read only newer events.
        recent:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecentEval'
        runnerInstanceId:
          type:
          - string
          - 'null'
        stats:
          $ref: '#/components/schemas/AgentStats'
        status:
          $ref: '#/components/schemas/AgentStatus'
    AgentsWhere:
      type: string
      description: 'Where an optimization''s agents run: this machine, or cloud runners.'
      enum:
      - local
      - cloud
    ApiError:
      type: object
      description: The body of every non-2xx response.
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Per-field problems, for `invalid_request`.
        message:
          type: string
          description: One plain sentence for the user. Never contains a secret.
    ApiEvent:
      oneOf:
      - type: object
        description: First message of a connection (no `id`).
        required:
        - lastEventId
        - serverTime
        - version
        - type
        properties:
          lastEventId:
            type: integer
            format: int64
            description: Id of the newest event so far.
            minimum: 0
          serverTime:
            type: integer
            format: int64
          type:
            type: string
            enum:
            - hello
          version:
            type: string
      - type: object
        description: |-
          The client's `Last-Event-ID` is older than what the daemon kept (or from before a restart): refetch
          everything you show.
        required:
        - reason
        - type
        properties:
          reason:
            type: string
          type:
            type: string
            enum:
            - resync
      - type: object
        description: An optimization changed status.
        required:
        - optimizationId
        - status
        - type
        properties:
          optimizationId:
            type: string
          status:
            $ref: '#/components/schemas/OptimizationStatus'
          type:
            type: string
            enum:
            - optimization
      - type: object
        description: An agent logged something. `event` carries it so a log view can append without refetching.
        required:
        - optimizationId
        - agentId
        - type
        properties:
          agentId:
            type: string
          event:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AgentEventVm'
          optimizationId:
            type: string
          type:
            type: string
            enum:
            - agent-event
      - type: object
        description: A candidate got its verdict.
        required:
        - optimizationId
        - candidateId
        - verdict
        - type
        properties:
          candidateId:
            type: string
          optimizationId:
            type: string
          type:
            type: string
            enum:
            - candidate
          verdict:
            $ref: '#/components/schemas/CandidateVerdict'
      - type: object
        description: 'The ratchet moved: a verified win.'
        required:
        - optimizationId
        - from
        - to
        - type
        properties:
          from:
            type: number
            format: double
          optimizationId:
            type: string
          to:
            type: number
            format: double
          type:
            type: string
            enum:
            - ratchet
      - type: object
        required:
        - optimizationId
        - totalUsd
        - type
        properties:
          optimizationId:
            type: string
          totalUsd:
            type: number
            format: double
          type:
            type: string
            enum:
            - spend
      - type: object
        required:
        - optimizationId
        - level
        - text
        - type
        properties:
          level:
            $ref: '#/components/schemas/NoticeLevel'
          optimizationId:
            type: string
          text:
            type: string
          type:
            type: string
            enum:
            - notice
      - type: object
        description: True while any run is active (the app turns it into "prevent system sleep").
        required:
        - active
        - optimizationIds
        - type
        properties:
          active:
            type: boolean
          optimizationIds:
            type: array
            items:
              type: string
          type:
            type: string
            enum:
            - run-active
      - type: object
        description: The automatic environment changing phase.
        required:
        - sandboxId
        - phase
        - text
        - type
        properties:
          phase:
            $ref: '#/components/schemas/SandboxPhase'
          region:
            type:
            - string
            - 'null'
          sandboxId:
            type: string
          text:
            type: string
          type:
            type: string
            enum:
            - sandbox
      - type: object
        description: 'Provisional: an environment draft changed status.'
        required:
        - draftId
        - status
        - type
        properties:
          draftId:
            type: string
          status:
            $ref: '#/components/schemas/EnvironmentDraftStatus'
          type:
            type: string
            enum:
            - environment-draft
      - type: object
