        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoInspectVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings:
    get:
      tags:
      - settings
      summary: 'The Settings screen: AWS profile and region, which secrets are stored, the advanced overrides, the engine.'
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings/advanced:
    put:
      tags:
      - settings
      summary: |-
        Region and the development overrides (AMI ids, OpenTofu paths). Validated as a whole; nothing is saved if any
        field is invalid (400 with a `fields` entry per problem).
      operationId: saveAdvancedSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveSettingsInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings/aws-profile:
    put:
      tags:
      - settings
      summary: Choose the AWS profile Ratchet uses (an empty name clears it).
      operationId: setAwsProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAwsProfileInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/settings/secrets/{name}:
    put:
      tags:
      - settings
      summary: Store a secret in the keychain. The value is checked for format before anything is stored and never returned.
      operationId: setSecret
      parameters:
      - name: name
        in: path
        description: anthropicApiKey, openaiApiKey or githubToken
        required: true
        schema:
          $ref: '#/components/schemas/SecretName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSecretInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
    delete:
      tags:
      - settings
      summary: Remove a stored secret.
      operationId: clearSecret
      parameters:
      - name: name
        in: path
        description: anthropicApiKey, openaiApiKey or githubToken
        required: true
        schema:
          $ref: '#/components/schemas/SecretName'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/status:
    get:
      tags:
      - status
      summary: 'Who is answering: version, engine, uptime, where the socket and the ledger are.'
      operationId: getStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/template-proposals:
    post:
      tags:
      - templates
      summary: '"Use template" / "Add via pull request": commit the template''s files on a branch of the repo and open the PR.'
      operationId: proposeTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeTemplateInput'
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposeTemplateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/templates:
    get:
      tags:
      - templates
      summary: 'The evaluator template gallery (Benchmarks): runnable templates, then the "Try a demo" entries.'
      operationId: listTemplates
      parameters:
      - name: kind
        in: query
        description: '`template` (runnable evaluators) or `demo` ("Try a demo"); default both.'
        required: false
        schema:
          $ref: '#/components/schemas/TemplateKind'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/templates/{id}:
    get:
      tags:
      - templates
      summary: One template by id (a legacy `--pack` name is accepted).
      operationId: getTemplate
      parameters:
      - name: id
        in: path
        description: Template id, e.g. http-latency
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
components:
  schemas:
    ActivityTone:
      type: string
      enum:
      - brass
      - mint
      - rose
      - neutral
    ActivityVm:
      type: object
      required:
      - id
      - optimizationId
      - agent
      - text
      - at
      - atMs
      - tone
      properties:
        agent:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AgentKind'
        at:
          type: string
          description: Relative time ("12m ago").
        atMs:
          type: integer
          format: int64
        id:
          type: string
        optimizationId:
          type: string
        text:
          type: string
        tone:
          $ref: '#/components/schemas/ActivityTone'
    AddAgentConnectorInput:
      oneOf:
      - type: object
        required:
        - agent
        - source
        properties:
          agent:
            $ref: '#/components/schemas/ConnectorAgent'
          source:
            type: string
            enum:
            - login
      - type: object
        required:
        - agent
        - apiKey
        - source
        properties:
          agent:
            $ref: '#/components/schemas/ConnectorAgent'
          apiKey:
            type: string
          name:
            type:
            - string
            - 'null'
          source:
            type: string
            enum:
            - api-key
      description: '`POST /v1/connectors/agents`: adopt a detected CLI login (one that was removed earlier) or store an API key.'
    AddAwsConnectorInput:
      type: object
      description: '`POST /v1/connectors/aws`.'
      required:
      - profile
      properties:
        monthlyCapUsd:
          type:
          - number
          - 'null'
          format: double
          description: USD per month; omit or `null` for no cap.
        name:
          type:
          - string
          - 'null'
        profile:
          type: string
          description: A profile from `~/.aws/config` or `~/.aws/credentials`.
        region:
          type:
          - string
          - 'null'
          description: Default `us-east-1`.
    AddGithubConnectorInput:
      type: object
      description: |-
        `POST /v1/connectors/github`: a pasted personal access token or app installation token, checked against GitHub
        before it is kept.
      required:
      - token
      properties:
        name:
          type:
          - string
          - 'null'
        token:
          type: string
    AdvancedDefaults:
      type: object
      description: What empty `tofuBinary` / `moduleDir` resolve to.
      required:
      - tofuBinary
      - moduleDir
      properties:
        moduleDir:
          type: string
        tofuBinary:
          type: string
    AdvancedSettingsVm:
      type: object
      description: The "Advanced (development)" disclosure of Settings.
      required:
      - values
      - defaults
      properties:
        defaults:
          $ref: '#/components/schemas/AdvancedDefaults'
        values:
          $ref: '#/components/schemas/LiveSettings'
    AgentConnectorSource:
      type: string
      enum:
      - login
      - api-key
    AgentEventVm:
      type: object
      required:
      - id
      - at
      - type
      - text
      properties:
        at:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        text:
          type: string
        type:
          type: string
    AgentEventsPage:
      type: object
      required:
      - events
      - cursor
      properties:
        cursor:
          type: integer
          format: int64
          description: Pass back as `cursor` to get only newer events.
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentEventVm'
    AgentKind:
      type: string
      description: Which agent CLI (or the mock) an agent runs.
      enum:
      - claude-code
      - codex
      - mock
    AgentRecentEval:
      type: object
      required:
      - value
      - verdict
      - label
      properties:
        label:
          type: string
        value:
          type: number
          format: double
        verdict:
          $ref: '#/components/schemas/CandidateVerdict'
    AgentSelection:
      type: object
      description: 'One agent choice: a connector and where it runs.'
      required:
      - connectorId
      - where
      properties:
        connectorId:
          type: string
        where:
          $ref: '#/components/schemas/AgentsWhere'
    AgentStats:
      type: object
      required:
      - candidates
      - verified
      - rejected
      - blocked
      - spendUsd
      properties:
        blocked:
          type: integer
          format: int64
        candidates:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
        spendUsd:
          type: number
          format: double
        verified:
          type: integer
          format: int64
    AgentStatus:
      type: string
      description: Agent lifecycle state.
      enum:
      - pending
      - launching
      - running
      - paused
      - stopped
      - done
      - failed
    AgentVm:
      type: object
      required:
      - id
      - kind
      - branch
      - status
      - hypothesis
      - recent
      - stats
      - lastEventId
      - runnerInstanceId
      properties:
        branch:
          type: string
        hypothesis:
          type:
          - string
          - 'null'
          description: Latest agent message, used as the "current hypothesis".
        id:
          type: string
        kind:
          $ref: '#/components/schemas/AgentKind'
        lastEventId:
          type: integer
          format: int64
          description: Pass to `GET /v1/agents/{id}/events?cursor=` to read only newer events.
        recent:
          type: array
          items:
            $ref: '#/components/schemas/AgentRecentEval'
        runnerInstanceId:
          type:
          - string
          - 'null'
        stats:
          $ref: '#/components/schemas/AgentStats'
        status:
          $ref: '#/components/schemas/AgentStatus'
    AgentsWhere:
      type: string
      description: 'Where an optimization''s agents run: this machine, or cloud runners.'
      enum:
      - local
      - cloud
    ApiError:
      type: object
      description: The body of every non-2xx response.
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Per-field problems, for `invalid_request`.
        message:
          type: string
          description: One plain sentence for the user. Never contains a secret.
    ApiEvent:
      oneOf:
      - type: object
        description: First message of a connection (no `id`).
        required:
        - lastEventId
        - serverTime
        - version
        - type
        properties:
          lastEventId:
            type: integer
            format: int64
            description: Id of the newest event so far.
            minimum: 0
          serverTime:
            type: integer
            format: int64
          type:
            type: string
            enum:
            - hello
          version:
            type: string
      - type: object
        description: |-
          The client's `Last-Event-ID` is older than what the daemon kept (or from before a restart): refetch
          everything you show.
        required:
        - reason
        - type
        properties:
          reason:
            type: string
          type:
            type: string
            enum:
            - resync
      - type: object
        description: An optimization changed status.
        required:
        - optimizationId
        - status
        - type
        properties:
          optimizationId:
            type: string
          status:
            $ref: '#/components/schemas/OptimizationStatus'
          type:
            type: string
            enum:
            - optimization
      - type: object
        description: An agent logged something. `event` carries it so a log view can append without refetching.
        required:
        - optimizationId
        - agentId
        - event
        - type
        properties:
          agentId:
            type: string
          event:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AgentEventVm'
          optimizationId:
            type: string
          type:
            type: string
            enum:
            - agent-event
      - type: object
        description: A candidate got its verdict.
        required:
        - optimizationId
        - candidateId
        - verdict
        - type
        properties:
          candidateId:
            type: string
          optimizationId:
            type: string
          type:
            type: string
            enum:
            - candidate
          verdict:
            $ref: '#/components/schemas/CandidateVerdict'
      - type: object
        description: 'The ratchet moved: a verified win.'
        required:
        - optimizationId
        - from
        - to
        - type
        properties:
          from:
            type: number
            format: double
          optimizationId:
            type: string
          to:
            type: number
            format: double
          type:
            type: string
            enum:
            - ratchet
      - type: object
        required:
        - optimizationId
        - totalUsd
        - type
        properties:
          optimizationId:
            type: string
          totalUsd:
            type: number
            format: double
          type:
            type: string
            enum:
            - spend
      - type: object
        required:
        - optimizationId
        - level
        - text
        - type
        properties:
          level:
            $ref: '#/components/schemas/NoticeLevel'
          optimizationId:
            type: string
          text:
            type: string
          type:
            type: string
            enum:
            - notice
      - type: object
        description: True while any run is active (the app turns it into "prevent system sleep").
        required:
        - active
        - optimizationIds
        - type
        properties:
          active:
            type: boolean
          optimizationIds:
            type: array
            items:
              type: string
          type:
            type: string
            enum:
            - run-active
      - type: object
        description: The automatic environment changing phase.
        required:
        - sandboxId
        - phase
        - region
        - text
        - type
        properties:
          phase:
            $ref: '#/components/schemas/SandboxPhase'
          region:
            type:
            - string
            - 'null'
          sandboxId:
            type: string
          text:
            type: string
          type:
            type: string
            enum:
            - sandbox
      - type: object
        description: 'Provisional: an environment draft changed status.'
        required:
        - draftId
        - status
        - type
        properties:
          draftId:
            type: string
          status:
            $ref: '#/components/schemas/EnvironmentDraftStatus'
          type:
            type: string
            enum:
            - environment-draft
      - type: object
        description: A connector changed (the device flow finished, a probe changed its status, it was removed).
        required:
        - connectorId
        - status
        - type
        properties:
          connectorId:
            type: string
          status:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConnectorStatus'
          type:
            type: string
            enum:
            - connector
      - type: object
        description: The GitHub sign-in changed (device flow finished, signed out).
        required:
        - signedIn
        - type
        properties:
          signedIn:
            type: boolean
          type:
            type: string
            enum:
            - github
      description: One message of the stream.
    AwsAuthKind:
      type: string
      description: '`profile` = a named profile with static keys or an assume-role; `sso` = a profile created by `aws configure sso`.'
      enum:
      - profile
      - sso
    AwsAuthStyle:
      type: string
      enum:
      - sso
      - role
      - keys
      - process
      - other
    AwsProfileKind:
      type: string
      enum:
      - sso
      - role
      - keys
      - process
      - other
    AwsProfileSource:
      type: string
      enum:
      - config
      - credentials
    AwsProfileVm:
      type: object
      description: A profile found in `~/.aws/config` or `~/.aws/credentials` (names only, never a key).
      required:
      - name
      - kind
      - source
      - ssoSession
      properties:
        kind:
          $ref: '#/components/schemas/AwsProfileKind'
        name:
          type: string
        source:
          $ref: '#/components/schemas/AwsProfileSource'
        ssoSession:
          type:
          - string
          - 'null'
          description: The `sso-session` a profile uses.
    AwsProfilesVm:
      type: object
      required:
      - profiles
      - ssoSessions
      - selected
      - region
      - defaultRegion
      - filesFound
      properties:
        defaultRegion:
          type: string
        filesFound:
          type: boolean
          description: False when neither file exists.
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/AwsProfileVm'
        region:
          type: string
        selected:
          type: string
          description: The profile Ratchet uses (empty = none chosen).
        ssoSessions:
          type: array
          items:
            type: string
          description: '`[sso-session x]` names in `~/.aws/config`.'
    BenchPipelineVm:
      type: object
      required:
      - candidate
      - queued
      - stages
      properties:
        candidate:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PipelineCandidate'
            description: Candidate the pipeline is working on / last worked on.
        queued:
          type: integer
          format: int64
        stages:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStage'
    Better:
      type: string
      description: Which way is better, as the screens say it.
      enum:
      - lower
      - higher
    Calibration:
      type: object
      description: The calibration record (stored as JSON in `engine_kv` under `opt:<id>:calibration`).
      required:
      - version
      - baselineRuns
      - cv
      - noise
      - repeats
      - repeatsSource
      - repeatsCapped
      - minGain
      - minGainSource
      - resolvable
      - noiseFactor
      - noiseFactorSource
      - explanation
      properties:
        baselineRuns:
          type: integer
          format: int64
          description: Number of baseline runs the noise was measured on.
          minimum: 0
        cv:
          type:
          - number
          - 'null'
          format: double
          description: |-
            Coefficient of variation of the baseline (fraction); `None` when it cannot be estimated (fewer than
            3 runs, or a zero mean).
        explanation:
          type: string
          description: |-
            Plain words for the UI, e.g. "this metric is noisy (±9%); wins must beat 9%; each candidate is
            measured 7 times".
        minGain:
          type: number
          format: double
          description: The win threshold as a fraction of the current best.
        minGainSource:
          $ref: '#/components/schemas/CalibrationSource'
        noise:
          type:
          - number
          - 'null'
          format: double
          description: '`2 x CV` as a fraction: "this metric moves by about +/- noise from run to run". `None` with `cv`.'
        noiseFactor:
          type: number
          format: double
          description: The k of the noise floor `k x stddev(baseline)`.
        noiseFactorSource:
          $ref: '#/components/schemas/CalibrationSource'
        repeats:
          type: integer
          format: int64
          description: Runs per candidate / confirm run.
          minimum: 0
        repeatsCapped:
          type: boolean
          description: True when the derivation wanted more than the cap allows.
        repeatsSource:
          $ref: '#/components/schemas/CalibrationSource'
        resolvable:
          type:
          - number
          - 'null'
          format: double
          description: |-
            The gain the chosen repeats can resolve with confidence (a fraction); `min_gain` is never below it
            when auto.
        version:
          type: integer
          format: int32
          description: Schema version of this record (it is stored as JSON).
          minimum: 0
    CalibrationSource:
      type: string
      description: Where a calibrated value came from.
      enum:
      - config
      - auto
      - default
    CandidateVerdict:
      type: string
      description: |-
        A candidate's verdict as stored in the ledger: `pending` until the bench runner decides, the rest
        mirror the ratchet rule.
      enum:
      - pending
      - verified
      - rejected
      - failed_confirm
      - blocked
    CandidateVm:
      type: object
      required:
      - id
      - sha
      - agentId
      - agent
      - message
      - submittedAt
      - t
      - verdict
      - reasons
      - benchValue
      - confirmValue
      - vsBaselinePct
      - movedRatchet
      - samples
      - stats
      properties:
        agent:
          $ref: '#/components/schemas/AgentKind'
        agentId:
          type: string
        benchValue:
          type:
          - number
          - 'null'
          format: double
        confirmValue:
          type:
          - number
          - 'null'
          format: double
        id:
          type: string
        message:
          type: string
        movedRatchet:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        samples:
          type: array
          items:
            type: number
            format: double
        sha:
          type: string
        stats:
          type: object
          description: Stats of the latest bench run (`value`, and p50/p95/p99 when the bench reports them).
          additionalProperties:
            type: number
            format: double
          propertyNames:
            type: string
        submittedAt:
          type: integer
          format: int64
        t:
          type: number
          format: double
          description: Minutes since the optimization started.
        verdict:
          $ref: '#/components/schemas/CandidateVerdict'
        vsBaselinePct:
          type:
          - number
          - 'null'
          format: double
          description: Signed % improvement vs the baseline (positive = better).
    CheckState:
      type: string
      enum:
      - ok
      - warn
      - fail
    CompareRow:
      type: object
      description: One row of "Baseline vs best" / "Before and after".
      required:
      - key
      - label
      - unit
      - baseline
      - best
      - deltaPct
      - better
      properties:
        baseline:
          type:
          - number
          - 'null'
          format: double
        best:
          type:
          - number
          - 'null'
          format: double
        better:
          $ref: '#/components/schemas/Better'
          description: Which way is better for this metric.
        deltaPct:
          type:
          - number
          - 'null'
          format: double
          description: Signed % change best vs baseline.
        key:
          type: string
        label:
          type: string
        unit:
          type: string
    ConfigError:
      type: object
      description: One problem found in `ratchet.yaml`.
      required:
      - path
      - message
      properties:
        message:
          type: string
        path:
          type: string
          description: YAML path, e.g. `guardrails[2].peak_rss` or `objective.direction`. Empty for whole-document errors.
    ConfigSummary:
      type: object
      required:
      - name
      - pack
      - metric
      - direction
      - minGain
      - evaluator
      - environment
      - value
      - guardrails
      - protectedGlobs
      - protectedEntries
      - instanceTypes
      properties:
        direction:
          $ref: '#/components/schemas/Direction'
        environment:
          $ref: '#/components/schemas/EnvironmentSummary'
        evaluator:
          $ref: '#/components/schemas/EvaluatorSummary'
        guardrails:
          type: array
          items:
            type: string
        instanceTypes:
          type: array
          items:
            type: string
        metric:
          type: string
        minGain:
          type: number
          format: double
        name:
          type:
          - string
          - 'null'
          description: '`objective.name`, the default optimization name.'
        pack:
          type:
          - string
          - 'null'
        protectedEntries:
          type: array
          items:
            $ref: '#/components/schemas/ProtectedEntryVm'
          description: Everything that is protected (automatic set plus the user's), with why.
        protectedGlobs:
          type: array
          items:
            type: string
          description: The user's own `protected:` additions.
        value:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ValueSummary'
    ConnectionResultVm:
      type: object
      required:
      - target
      - ok
      - detail
      properties:
        detail:
          type: string
          description: One line; never contains a key or token.
        ok:
          type: boolean
        target:
          $ref: '#/components/schemas/ConnectionTarget'
    ConnectionTarget:
      type: string
      enum:
      - aws
      - github
      - anthropic
      - openai
    ConnectorAgent:
      type: string
      description: The two agent CLIs Ratchet drives.
      enum:
      - claude-code
      - codex
    ConnectorStatus:
      type: string
      description: |-
        - `connected`: a GitHub account / AWS profile / agent login that works
        - `expired`: it worked once and needs signing in again (GitHub token revoked, `aws sso login` needed)
        - `signed-out`: nothing to use (an agent CLI that is not signed in or not installed, a GitHub account without a token)
        - `valid`: an API key the provider accepted
        - `invalid`: an API key (or static AWS keys) the provider rejected
      enum:
      - connected
      - expired
      - signed-out
      - valid
      - invalid
    ConnectorTestVm:
      type: object
      description: Result of "Test connection" on one connector.
      required:
      - ok
      - detail
      - connector
      properties:
        connector:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ConnectorVm'
            description: The connector with its fresh status (`null` if it no longer exists).
        detail:
          type: string
          description: One line; never contains a key or token.
        ok:
          type: boolean
    ConnectorVm:
      oneOf:
      - type: object
        required:
        - id
        - name
        - detail
        - status
        - isDefault
        - login
        - source
        - kind
        properties:
          detail:
            type: string
            description: One muted line under the name. Backticks mark a command to show in monospace.
          id:
            type: string
          isDefault:
            type: boolean
            description: The default of its kind (one per kind).
          kind:
            type: string
            enum:
            - github
          login:
            type:
            - string
            - 'null'
            description: The account's login, `null` until it is known.
          name:
            type: string
            description: What the user sees and can rename ("srikanth235").
          source:
            $ref: '#/components/schemas/GithubConnectorSource'
          status:
            $ref: '#/components/schemas/ConnectorStatus'
      - type: object
        required:
        - id
        - name
        - detail
        - status
        - isDefault
        - profile
        - region
        - auth
        - monthlyCapUsd
        - kind
        properties:
          auth:
            $ref: '#/components/schemas/AwsAuthStyle'
          detail:
            type: string
          id:
            type: string
          isDefault:
            type: boolean
          kind:
            type: string
            enum:
            - aws
          monthlyCapUsd:
            type:
            - number
            - 'null'
            format: double
            description: Optional monthly spend cap in USD.
          name:
            type: string
          profile:
            type: string
            description: Profile name in `~/.aws/config` (names only; credentials stay where AWS keeps them).
          region:
            type: string
          status:
            $ref: '#/components/schemas/ConnectorStatus'
      - type: object
        required:
        - id
        - name
        - detail
        - status
        - isDefault
        - agent
        - source
        - runsOn
        - version
        - keyHint
        - kind
        properties:
          agent:
            $ref: '#/components/schemas/ConnectorAgent'
          detail:
            type: string
          id:
            type: string
          isDefault:
            type: boolean
            description: 'For agents: the one used when a run does not choose.'
          keyHint:
            type:
            - string
            - 'null'
            description: Last characters of a stored key, e.g. `····4f2a`. Never the key.
          kind:
            type: string
            enum:
            - agent
          name:
            type: string
          runsOn:
            type: array
            items:
              $ref: '#/components/schemas/AgentsWhere'
            description: '`login` runs on this Mac only; `api-key` can run here or on cloud runners.'
          source:
            $ref: '#/components/schemas/AgentConnectorSource'
          status:
            $ref: '#/components/schemas/ConnectorStatus'
          version:
            type:
            - string
            - 'null'
            description: Detected CLI version (login) or `null`.
      description: One saved connector. `kind` says which of the three it is; the first fields are common.
    ConnectorsVm:
      type: object
      description: Everything the Connectors screen shows.
      required:
