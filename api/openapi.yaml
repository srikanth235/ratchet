        description: Optimization id
        required: true
        schema:
          type: string
      - name: metric
        in: query
        description: One of the series' `options` keys; default the objective.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatchetSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/receipt:
    get:
      tags:
      - environments
      summary: The receipt of the sandbox teardown that covered this run. 404 while the environment is still alive.
      operationId: getReceipt
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
