      - actualUsd
      - deltaUsd
      - written
      properties:
        actualUsd:
          type: number
          format: double
          description: Billed amount for the category.
        category:
          $ref: '#/components/schemas/SpendCategory'
        deltaUsd:
          type: number
          format: double
