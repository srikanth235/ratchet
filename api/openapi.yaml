openapi: 3.1.0
info:
  title: ratchetd
  description: 'The Ratchet daemon API: REST resources over HTTP on a local unix socket, plus one server-sent-event stream. Every route needs `Authorization: Bearer <token>` (the per-boot token the daemon writes next to its socket). Timestamps are epoch milliseconds, money is USD. Routes tagged `(provisional)` mirror features that are still being built and may change.'
  version: v1
servers:
- url: http://localhost
  description: The daemon, over its unix socket (`ratchetd.sock`).
paths:
  /v1/activity:
    get:
      tags:
      - optimizations
      summary: The merged, newest-first feed of verdicts and verified wins.
      operationId: listActivity
      parameters:
      - name: optimizationId
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: 1..=200, default 20.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/events:
    get:
      tags:
      - agents
      summary: 'An agent''s log. Without `cursor`: the newest events (oldest first). With it: only events newer than the cursor.'
      operationId: listAgentEvents
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: 'Return only events newer than this id. Without it: the newest `limit` events.'
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 1..=1000, default 200.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEventsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/messages:
    post:
      tags:
      - agents
      summary: Send the agent a note; it reads it at the start of its next turn.
      operationId: messageAgent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageAgentInput'
        required: true
      responses:
        '204':
          description: Delivered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/pause:
    post:
      tags:
      - agents
      summary: Pause the agent after its current step.
      operationId: pauseAgent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Paused
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/agents/{id}/resume:
    post:
      tags:
      - agents
      summary: Resume a paused agent.
      operationId: resumeAgent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Resumed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/aws/profiles:
    get:
      tags:
      - aws
      summary: The AWS profiles found on this Mac (names only).
      operationId: listAwsProfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsProfilesVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/config/validations:
    post:
      tags:
      - config
      summary: 'Parse ratchet.yaml text (read-only; the repo owns the file). Always 200: problems are in the result.'
      operationId: validateConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateConfigInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateConfigResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connection-tests:
    post:
      tags:
      - settings
      summary: A read-only probe of AWS (STS), GitHub or a model API. Secrets are read inside the daemon.
      operationId: testConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResultVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connector-selections:
    get:
      tags:
      - connectors
      summary: The choice remembered for a repo, and what a run on it would use now (saved choice, else the defaults).
      operationId: getConnectorSelection
      parameters:
      - name: repo
        in: query
        description: '`owner/name`'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoConnectionsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
    put:
      tags:
      - connectors
      summary: |-
        Check and remember the choice for a repo. 400 when it cannot run: an unknown id, a login in the cloud, two
        connectors for one agent, no agent.
      operationId: saveConnectorSelection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveRepoConnectionsInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoConnectionsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors:
    get:
      tags:
      - connectors
      summary: Every connector (detected CLI logins included), the device flow in progress and the keychain state.
      operationId: listConnectors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/agents:
    post:
      tags:
      - connectors
      summary: |-
        A detected CLI login (one that was removed) or a pasted API key. The key goes to the keychain and is never
        returned.
      operationId: addAgentConnector
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAgentConnectorInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/aws:
    post:
      tags:
      - connectors
      summary: Connect an AWS profile from `~/.aws` with a region and an optional monthly cap.
      operationId: addAwsConnector
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAwsConnectorInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/github:
    post:
      tags:
      - connectors
      summary: |-
        A pasted GitHub token (personal access token or app token), checked against GitHub before it is kept. The token
        goes to the keychain and is never returned.
      operationId: addGithubConnector
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGithubConnectorInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/github/sign-in:
    post:
      tags:
      - connectors
      summary: |-
        Start the device flow for a new account, or `connectorId` to sign it in again. `githubFlow` in the answer carries
        the code to show; the daemon polls and stores the token.
      operationId: startGithubConnectorSignIn
      requestBody:
        description: Optional; an empty body starts a new account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGithubSignInInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
    delete:
      tags:
      - connectors
      summary: Stop the device flow in progress.
      operationId: cancelGithubConnectorSignIn
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/refresh:
    post:
      tags:
      - connectors
      summary: Check every connector with its provider (and probe the machine for agent CLIs again), then list.
      operationId: refreshConnectors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/{id}:
    delete:
      tags:
      - connectors
      summary: Remove a connector and forget its secret. Optimizations already running keep what they have.
      operationId: removeConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
    patch:
      tags:
      - connectors
      summary: 'Rename; AWS: region and monthly cap (`null` removes the cap).'
      operationId: updateConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectorInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/{id}/default:
    post:
      tags:
      - connectors
      summary: Make this connector the default of its kind.
      operationId: setDefaultConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/connectors/{id}/test:
    post:
      tags:
      - connectors
      summary: '"Test connection": probe the account with its provider and remember the status.'
      operationId: testConnector
      parameters:
      - name: id
        in: path
        description: Connector id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorTestVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts:
    post:
      tags:
      - environment drafts (provisional)
      summary: Ask an agent to draft the environment this goal needs (scope none, single or full, resources, checks, cost).
      operationId: createEnvironmentDraft
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentDraftInput'
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}:
    get:
      tags:
      - environment drafts (provisional)
      summary: One environment draft.
      operationId: getEnvironmentDraft
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/approval:
    post:
      tags:
      - environment drafts (provisional)
      summary: 'Approve and lock the environment: agents change code only, never the environment. 409 unless every check passed.'
      operationId: approveEnvironmentDraft
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/files:
    get:
      tags:
      - environment drafts (provisional)
      summary: '"View files": the files the draft adds, with their content.'
      operationId: listEnvironmentDraftFiles
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvFilesVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/pull-request:
    post:
      tags:
      - environment drafts (provisional)
      summary: '"Open as PR": add the environment files to the repo through a pull request.'
      operationId: openEnvironmentDraftPullRequest
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environment-drafts/{id}/revisions:
    post:
      tags:
      - environment drafts (provisional)
      summary: '"Ask for a change" or "Use a smaller setup": the agent revises the draft. 409 once approved.'
      operationId: reviseEnvironmentDraft
      parameters:
      - name: id
        in: path
        description: Draft id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseEnvironmentDraftInput'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentDraftVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environments:
    get:
      tags:
      - environments
      summary: 'What is running and what it costs: the automatic environments and the last teardown receipt.'
      operationId: listEnvironments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/environments/{sandboxId}/end:
    post:
      tags:
      - environments
      summary: '"End sandbox now": tear the environment down without waiting for the idle window. 409 while a run is active.'
      operationId: endEnvironment
      parameters:
      - name: sandboxId
        in: path
        description: Sandbox id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentsVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A run is still active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          $ref: '#/components/responses/Failure'
  /v1/events:
    get:
      tags:
      - events
      summary: The live event stream (server-sent events).
      description: |-
        Each message has `event:` = the `type` of the payload, `id:` = a sequence number and `data:` = the JSON of an
        `ApiEvent`. Reconnect with `Last-Event-ID` to receive what was missed; when the daemon cannot replay it (it
        restarted, or the gap is older than its window) the stream starts with a `resync` event and the client refetches
        its snapshots. The first message is always `hello` (it has no `id`). A comment line keeps the connection alive.
      operationId: streamEvents
      parameters:
      - name: Last-Event-ID
        in: header
        description: Id of the last event the client saw.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
      responses:
        '200':
          description: A stream of server-sent events; each `data:` is an ApiEvent.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ApiEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/repos:
    get:
      tags:
      - github
      summary: The signed-in account's repos, optionally filtered by a substring of `owner/name`. 409 when not signed in.
      operationId: listRepos
      parameters:
      - name: query
        in: query
        description: Substring of `owner/name`.
        required: false
        schema:
          type: string
      - name: connectorId
        in: query
        description: 'List with this GitHub connector (default: the default one).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepoVm'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/session:
    delete:
      tags:
      - github
      summary: Sign out of GitHub and forget the token.
      operationId: signOutOfGithub
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubStatusVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/sign-in:
    post:
      tags:
      - github
      summary: 'Start "Sign in with GitHub" (device flow): returns the code to show; the daemon polls and stores the token.'
      operationId: startGithubSignIn
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubStatusVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/github/status:
    get:
      tags:
      - github
      summary: The GitHub row of Settings.
      operationId: getGithubStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GithubStatusVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/harnesses:
    get:
      tags:
      - harnesses
      summary: 'The detected agent CLIs (Claude Code, Codex): installed, version, signed in.'
      operationId: listHarnesses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HarnessVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/harnesses/detections:
    post:
      tags:
      - harnesses
      summary: '"Re-detect": probe the machine again.'
      operationId: detectHarnesses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HarnessVm'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations:
    get:
      tags:
      - optimizations
      summary: 'Everything the Optimizations screen shows: KPI cards, the featured run''s chart, the table, the activity feed.'
      operationId: listOptimizations
      parameters:
      - name: range
        in: query
        description: KPI window; default `30d`.
        required: false
        schema:
          $ref: '#/components/schemas/KpiRange'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationsSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
    post:
      tags:
      - optimizations
      summary: Create an optimization (a draft; `start` runs it). With `demo` it runs in simulation with no setup.
      operationId: createOptimization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptimizationInput'
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedOptimization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}:
    get:
      tags:
      - optimizations
      summary: One optimization with its agents, bench pipeline, baseline vs best, receipt and calibration.
      operationId: getOptimization
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /v1/optimizations/{id}/calibration:
    get:
      tags:
      - optimizations
      summary: The auto-calibrated statistics (repeats, the gain a win must beat). 404 until the baseline has run.
      operationId: getCalibration
      parameters:
      - name: id
        in: path
        description: Optimization id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
